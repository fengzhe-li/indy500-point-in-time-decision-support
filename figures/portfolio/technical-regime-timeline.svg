<text x="483" y="411" fill="#9bb0bd" font-family="Arial" font-size="19">41 transitions • FINAL_V2</text>
<path d="M800 415 L830 415" stroke="#45c7d8" stroke-width="3" fill="none" marker-end="url(#a)"/>
