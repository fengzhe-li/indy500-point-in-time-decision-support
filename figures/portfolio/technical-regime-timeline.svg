<text x="98" y="411" fill="#9bb0bd" font-family="Arial" font-size="19">2019: 10 direct transitions</text>
<path d="M415 415 L445 415" stroke="#45c7d8" stroke-width="3" fill="none" marker-end="url(#a)"/>
