<text x="1253" y="411" fill="#9bb0bd" font-family="Arial" font-size="19">structurally no same-day initial-round repeats</text>
<rect x="270" y="650" width="1060" height="100" rx="18" fill="#141e29" stroke="#ff9f43" stroke-width="3"/>
<text x="298" y="692" fill="#ff9f43" font-family="Arial" font-size="23" font-weight="700">INTERPRETATION</text>
<text x="298" y="730" fill="#edf4f7" font-family="Arial" font-size="19">Directionally compatible evidence across regimes; coefficient invariance is not established.</text>
