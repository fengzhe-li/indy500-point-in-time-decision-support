<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45c7d8"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="85" fill="#17232d" font-family="Arial" font-size="42" font-weight="700">Technical regime and operational applicability</text>
<text x="80" y="125" fill="#526672" font-family="Arial" font-size="21">Coefficient compatibility and qualifying-format applicability are separate questions.</text>
<rect x="70" y="300" width="345" height="230" rx="18" fill="#f5f8fa" stroke="#168fa3" stroke-width="3"/>
<text x="98" y="342" fill="#168fa3" font-family="Arial" font-size="23" font-weight="700">2018–2019</text>
<text x="98" y="380" fill="#17232d" font-family="Arial" font-size="19">PRE-AEROSCREEN</text>
<text x="98" y="411" fill="#526672" font-family="Arial" font-size="19">2019: 10 direct transitions</text>
<path d="M415 415 L445 415" stroke="#168fa3" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="455" y="300" width="345" height="230" rx="18" fill="#f5f8fa" stroke="#168a62" stroke-width="3"/>
<text x="483" y="342" fill="#168a62" font-family="Arial" font-size="23" font-weight="700">2020–2024</text>
<text x="483" y="380" fill="#17232d" font-family="Arial" font-size="19">FROZEN REFERENCE ERA</text>
<text x="483" y="411" fill="#526672" font-family="Arial" font-size="19">41 transitions • FINAL_V2</text>
<path d="M800 415 L830 415" stroke="#168fa3" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="840" y="300" width="345" height="230" rx="18" fill="#f5f8fa" stroke="#d87316" stroke-width="3"/>
<text x="868" y="342" fill="#d87316" font-family="Arial" font-size="23" font-weight="700">2025</text>
<text x="868" y="380" fill="#17232d" font-family="Arial" font-size="19">AEROSCREEN + HYBRID</text>
<text x="868" y="411" fill="#526672" font-family="Arial" font-size="19">23 direct physics transitions • 15 external cases</text>
<path d="M1185 415 L1215 415" stroke="#168fa3" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="1225" y="300" width="345" height="230" rx="18" fill="#f5f8fa" stroke="#c94444" stroke-width="3" stroke-dasharray="12 9"/>
<text x="1253" y="342" fill="#c94444" font-family="Arial" font-size="23" font-weight="700">2026</text>
<text x="1253" y="380" fill="#17232d" font-family="Arial" font-size="19">FORMAT BOUNDARY</text>
<text x="1253" y="411" fill="#526672" font-family="Arial" font-size="19">structurally no same-day initial-round repeats</text>
<rect x="270" y="650" width="1060" height="100" rx="18" fill="#f5f8fa" stroke="#d87316" stroke-width="3"/>
<text x="298" y="692" fill="#d87316" font-family="Arial" font-size="23" font-weight="700">INTERPRETATION</text>
<text x="298" y="730" fill="#17232d" font-family="Arial" font-size="19">Directionally compatible evidence across regimes; coefficient invariance is not established.</text>
