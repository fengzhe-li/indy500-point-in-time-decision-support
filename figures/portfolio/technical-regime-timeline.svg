<rect width="1600" height="900" fill="#0b1118"/>
<text x="80" y="85" fill="#edf4f7" font-family="Arial" font-size="42" font-weight="700">Technical regime and operational applicability</text>
<text x="80" y="125" fill="#9bb0bd" font-family="Arial" font-size="21">Coefficient compatibility and qualifying-format applicability are separate questions.</text>
