<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45c7d8"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="85" fill="#17232d" font-family="Arial" font-size="42" font-weight="700">Future track state is modelled separately</text>
<text x="80" y="125" fill="#526672" font-family="Arial" font-size="21">Future track temperature is not treated as future ambient temperature.</text>
