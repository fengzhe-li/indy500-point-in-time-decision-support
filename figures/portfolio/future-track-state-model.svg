<text x="788" y="357" fill="#168a62" font-family="Arial" font-size="23" font-weight="700">M2b HORIZON-SPECIFIC MODEL</text>
<text x="788" y="395" fill="#17232d" font-family="Arial" font-size="19">one fitted model per scientific anchor</text>
<text x="788" y="426" fill="#526672" font-family="Arial" font-size="19">future ambient change + thermal gap + solar state</text>
<text x="788" y="457" fill="#526672" font-family="Arial" font-size="19">finite-sample conformal residual calibration</text>
<text x="788" y="488" fill="#526672" font-family="Arial" font-size="19">leave-one-year-out selection</text>
