<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45c7d8"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="85" fill="#17232d" font-family="Arial" font-size="42" font-weight="700">Evidence hierarchy and quarantine</text>
<text x="80" y="125" fill="#526672" font-family="Arial" font-size="21">Numerical availability alone does not establish modelling eligibility.</text>
<rect x="175" y="180" width="1250" height="110" rx="18" fill="#f5f8fa" stroke="#168a62" stroke-width="3"/>
<text x="203" y="222" fill="#168a62" font-family="Arial" font-size="23" font-weight="700">PRIMARY MODELLING EVIDENCE</text>
<text x="203" y="260" fill="#17232d" font-family="Arial" font-size="19">Complete official four-lap attempts</text>
<rect x="212" y="330" width="1175" height="110" rx="18" fill="#f5f8fa" stroke="#168fa3" stroke-width="3"/>
<text x="240" y="372" fill="#168fa3" font-family="Arial" font-size="23" font-weight="700">SECONDARY MECHANISM EVIDENCE</text>
<text x="240" y="410" fill="#17232d" font-family="Arial" font-size="19">Section and trap measures from completed attempts</text>
<rect x="250" y="480" width="1100" height="110" rx="18" fill="#f5f8fa" stroke="#d87316" stroke-width="3"/>
<text x="278" y="522" fill="#d87316" font-family="Arial" font-size="23" font-weight="700">RECONSTRUCTION-ONLY EVIDENCE</text>
<text x="278" y="560" fill="#17232d" font-family="Arial" font-size="19">Partial laps, waved-off runs and incomplete traces</text>
<rect x="287" y="630" width="1025" height="110" rx="18" fill="#f5f8fa" stroke="#c94444" stroke-width="3" stroke-dasharray="12 9"/>
<text x="315" y="672" fill="#c94444" font-family="Arial" font-size="23" font-weight="700">QUARANTINED</text>
<text x="315" y="710" fill="#17232d" font-family="Arial" font-size="19">Unresolved identity, chronology or environmental linkage</text>
</svg>