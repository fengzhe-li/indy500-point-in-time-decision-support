<text x="858" y="512" fill="#168a62" font-family="Arial" font-size="23" font-weight="700">RESPONSE INTERFACE</text>
<text x="858" y="550" fill="#17232d" font-family="Arial" font-size="19">39 / 41 section-linked</text>
<text x="858" y="581" fill="#526672" font-family="Arial" font-size="19">9 dependent sections per linked transition</text>
<text x="858" y="612" fill="#526672" font-family="Arial" font-size="19">diagnostic evidence, no sample inflation</text>
