<path d="M800 340 L800 470" stroke="#168fa3" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M1290 340 L1100 470" stroke="#168fa3" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="350" y="470" width="420" height="165" rx="18" fill="#f5f8fa" stroke="#168fa3" stroke-width="3"/>
<text x="378" y="512" fill="#168fa3" font-family="Arial" font-size="23" font-weight="700">FUTURE-STATE INTERFACE</text>
<text x="378" y="550" fill="#17232d" font-family="Arial" font-size="19">656 current–future pairs</text>
<text x="378" y="581" fill="#526672" font-family="Arial" font-size="19">15 / 30 / 60 / 90 / 120 min</text>
<text x="378" y="612" fill="#526672" font-family="Arial" font-size="19">predicts physical state, not opportunity</text>
