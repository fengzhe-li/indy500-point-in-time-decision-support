<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45c7d8"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="85" fill="#17232d" font-family="Arial" font-size="42" font-weight="700">Evidence products, not one homogeneous dataset</text>
<text x="80" y="125" fill="#526672" font-family="Arial" font-size="21">Verified counts branch into different scientific roles.</text>
<rect x="100" y="190" width="420" height="150" rx="18" fill="#f5f8fa" stroke="#168fa3" stroke-width="3"/>
<text x="128" y="232" fill="#168fa3" font-family="Arial" font-size="23" font-weight="700">OBSERVED TRACK STATE</text>
<text x="128" y="270" fill="#17232d" font-family="Arial" font-size="19">168 temperature observations</text>
<text x="128" y="301" fill="#526672" font-family="Arial" font-size="19">2020–2024 structured PTSC evidence</text>
<rect x="590" y="190" width="420" height="150" rx="18" fill="#f5f8fa" stroke="#168a62" stroke-width="3"/>
<text x="618" y="232" fill="#168a62" font-family="Arial" font-size="23" font-weight="700">QUALIFYING PERFORMANCE</text>
<text x="618" y="270" fill="#17232d" font-family="Arial" font-size="19">41 evidence-qualified transitions</text>
<text x="618" y="301" fill="#526672" font-family="Arial" font-size="19">same-car, complete four-lap attempts</text>
<rect x="1080" y="190" width="420" height="150" rx="18" fill="#f5f8fa" stroke="#d87316" stroke-width="3"/>
<text x="1108" y="232" fill="#d87316" font-family="Arial" font-size="23" font-weight="700">EXTERNAL REGIME</text>
<text x="1108" y="270" fill="#17232d" font-family="Arial" font-size="19">15 eligible 2025 cases</text>
<text x="1108" y="301" fill="#526672" font-family="Arial" font-size="19">held outside frozen 2020–2024 core</text>
