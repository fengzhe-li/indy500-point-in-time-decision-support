<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45c7d8"/></marker></defs>
<rect width="1600" height="900" fill="#0b1118"/>
<text x="80" y="85" fill="#edf4f7" font-family="Arial" font-size="42" font-weight="700">Three propagated uncertainty sources</text>
<text x="80" y="125" fill="#9bb0bd" font-family="Arial" font-size="21">The empirical attempt-level residual dominates predictive width.</text>
<rect x="70" y="210" width="440" height="150" rx="18" fill="#141e29" stroke="#45c7d8" stroke-width="3"/>
<text x="98" y="252" fill="#45c7d8" font-family="Arial" font-size="23" font-weight="700">PHYSICAL COEFFICIENTS</text>
<text x="98" y="290" fill="#edf4f7" font-family="Arial" font-size="19">5,000 paired bootstrap draws</text>
<path d="M290 360 L800 520" stroke="#45c7d8" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="580" y="210" width="440" height="150" rx="18" fill="#141e29" stroke="#65d6a6" stroke-width="3"/>
<text x="608" y="252" fill="#65d6a6" font-family="Arial" font-size="23" font-weight="700">FUTURE TRACK STATE</text>
<text x="608" y="290" fill="#edf4f7" font-family="Arial" font-size="19">horizon-specific calibrated residuals</text>
<path d="M800 360 L800 520" stroke="#45c7d8" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="1090" y="210" width="440" height="150" rx="18" fill="#141e29" stroke="#ff9f43" stroke-width="3"/>
<text x="1118" y="252" fill="#ff9f43" font-family="Arial" font-size="23" font-weight="700">UNEXPLAINED PERFORMANCE</text>
<text x="1118" y="290" fill="#edf4f7" font-family="Arial" font-size="19">symmetrized out-of-year residuals</text>
<path d="M1310 360 L800 520" stroke="#45c7d8" stroke-width="3" fill="none" marker-end="url(#a)"/>
<circle cx="800" cy="570" r="105" fill="#141e29" stroke="#45c7d8" stroke-width="4"/><text x="800" y="560" text-anchor="middle" fill="#edf4f7" font-family="Arial" font-size="26" font-weight="700">MONTE CARLO</text><text x="800" y="600" text-anchor="middle" fill="#9bb0bd" font-family="Arial" font-size="19">joint propagation</text>
<path d="M800 675 L800 735" stroke="#45c7d8" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="470" y="735" width="660" height="100" rx="18" fill="#141e29" stroke="#65d6a6" stroke-width="3"/>
<text x="498" y="777" fill="#65d6a6" font-family="Arial" font-size="23" font-weight="700">PREDICTIVE OUTPUT</text>
<text x="498" y="815" fill="#edf4f7" font-family="Arial" font-size="19">E[Δv] • median • 80% / 90% intervals • P(Δv &gt; 0)</text>
</svg>