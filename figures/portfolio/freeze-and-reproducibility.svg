<text x="80" y="85" fill="#17232d" font-family="Arial" font-size="42" font-weight="700">Freeze and reproducibility discipline</text>
<text x="80" y="125" fill="#526672" font-family="Arial" font-size="21">Later evidence is evaluated externally and cannot silently alter FINAL_V2.</text>
