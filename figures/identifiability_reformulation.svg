<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500"><rect width="1000" height="500" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:14px}.box{fill:#f5f5f5;stroke:#555;stroke-width:1.5}.good{fill:#e7f2e7;stroke:#4c7}.bad{fill:#f8e8e8;stroke:#c77}.arr{stroke:#555;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="500" y="35" text-anchor="middle" class="t">Identifiability-Driven Problem Reformulation</text><rect x="330" y="65" width="340" height="65" rx="8" class="box"/><text x="500" y="92" text-anchor="middle" class="h">Original strategy problem</text><text x="500" y="114" text-anchor="middle" class="s">retain current result ↔ withdraw for priority</text><line x1="500" y1="130" x2="500" y2="165" class="arr"/><rect x="330" y="165" width="340" height="58" rx="8" class="box"/><text x="500" y="190" text-anchor="middle" class="h">Historical identifiability analysis</text><text x="500" y="211" text-anchor="middle" class="s">What can actually be reconstructed defensibly?</text><line x1="420" y1="223" x2="245" y2="265" class="arr"/><line x1="580" y1="223" x2="755" y2="265" class="arr"/><rect x="70" y="265" width="350" height="100" rx="8" class="bad"/><text x="245" y="292" text-anchor="middle" class="h">Opportunity process P(H | Q)</text><text x="245" y="318" text-anchor="middle" class="s">NOT RELIABLY IDENTIFIABLE</text><text x="245" y="342" text-anchor="middle" class="s">queue state · withdrawal timing · requeue · intent</text><rect x="580" y="265" width="350" height="100" rx="8" class="good"/><text x="755" y="292" text-anchor="middle" class="h">Performance process p(Δv | H=h)</text><text x="755" y="318" text-anchor="middle" class="s">DEFENSIBLY IDENTIFIABLE</text><text x="755" y="342" text-anchor="middle" class="s">same-car repeats + reconstructed physical state</text><line x1="755" y1="365" x2="755" y2="400" class="arr"/><rect x="580" y="400" width="350" height="65" rx="8" class="box"/><text x="755" y="426" text-anchor="middle" class="h">FINAL_V2 conditional inference</text><text x="755" y="449" text-anchor="middle" class="s">15 / 30 / 60 / 90 / 120 min calibrated anchors</text><text x="245" y="410" text-anchor="middle" class="s">Live queue context remains external</text><text x="245" y="433" text-anchor="middle" class="s">to the physical model.</text></svg>