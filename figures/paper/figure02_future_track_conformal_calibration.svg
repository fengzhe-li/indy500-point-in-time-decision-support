<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500"><rect width="1000" height="500" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:24px;font-weight:700}.s{font-size:15px}.a{font-size:13px}.b{fill:#4c78a8}.c{fill:#f58518}.axis{stroke:#333}</style><text x="500" y="35" text-anchor="middle" class="t">Horizon-Specific Conformal Calibration</text><text x="260" y="75" text-anchor="middle" class="s">Observed interval coverage</text><line x1="80" y1="410" x2="470" y2="410" class="axis"/><line x1="80" y1="110" x2="80" y2="410" class="axis"/><line x1="80" y1="170" x2="470" y2="170" stroke="#777" stroke-dasharray="6 5"/><line x1="80" y1="140" x2="470" y2="140" stroke="#777" stroke-dasharray="6 5"/><rect x="135" y="168" width="60" height="242" class="b"/><rect x="205" y="137" width="60" height="273" class="c"/><rect x="315" y="227" width="60" height="183" class="b"/><rect x="385" y="200" width="60" height="210" class="c"/><g class="a" text-anchor="middle"><text x="200" y="435">Overall</text><text x="380" y="435">2022 held-out</text><text x="165" y="160">80.6%</text><text x="235" y="129">90.9%</text><text x="345" y="219">61.0%</text><text x="415" y="192">69.9%</text></g><text x="750" y="75" text-anchor="middle" class="s">Aggregate interval width</text><line x1="570" y1="410" x2="940" y2="410" class="axis"/><rect x="650" y="198" width="90" height="212" class="b"/><rect x="790" y="121" width="90" height="289" class="c"/><g class="a" text-anchor="middle"><text x="695" y="435">80%</text><text x="835" y="435">90%</text><text x="695" y="188">5.672 °C</text><text x="835" y="111">7.718 °C</text></g><text x="500" y="475" text-anchor="middle" class="a">Overall calibration is close to nominal; 2022 is an explicit distribution-shift / applicability limitation.</text></svg>