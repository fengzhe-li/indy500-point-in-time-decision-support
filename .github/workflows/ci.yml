# FINAL_V3 CI.
#
# Scope: Python scientific + API tests, frontend tests + build,
# FINAL_V2 immutability, V3<->V2 behavioural regression, and a Docker
# build smoke check. No huge downloads: base images are python:3.12-slim,
# node:20-slim, and nginx:alpine.
name: indy500-v3-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r v3_point_in_time/requirements.txt
      - name: Run full Python test suite (scientific + API)
        run: python -m unittest discover -s v3_point_in_time/tests -p 'test_*.py' -v
      - name: V2 frozen-dependency immutability check
        run: python v3_point_in_time/scripts/run_v2_immutability_check.py
      - name: V3<->V2 behavioural regression
        run: python v3_point_in_time/scripts/run_v3_v2_behavioral_regression.py
      - name: Scenario Mode smoke test
        run: python v3_point_in_time/scripts/smoke_test.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3_point_in_time/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Docker build context
        run: bash v3_point_in_time/scripts/prepare_docker_context.sh
      - name: Build API image
        run: docker build -f v3_point_in_time/docker/Dockerfile.api -t v3-api:ci v3_point_in_time/docker/build_context
      - name: Build frontend image
        run: docker build -f v3_point_in_time/docker/Dockerfile.frontend -t v3-frontend:ci v3_point_in_time
